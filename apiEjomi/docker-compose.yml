services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: maquis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-maquis_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-M@quis_P@assw0rd123}
      POSTGRES_DB: ${DB_NAME:-gestion_maquis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - maquis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-maquis_user} -d ${DB_NAME:-gestion_maquis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Node.js
  api:
    image: ssarata/maquis-api:latest
    container_name: maquis-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./dotenv
    environment:
      NODE_ENV: production
      PORT: 3001
      API_URL: ${API_URL:-http://localhost:3001}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-maquis_user}:M%40quis@postgres:5432/${DB_NAME:-gestion_maquis}?schema=public}
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_change_me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3002,https://au-bon-moment.com,https://www.au-bon-moment.com}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - maquis-network
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Application Next.js
  frontend:
    container_name: maquis-frontend
    restart: unless-stopped
    build:
      context: ../ejomiFront
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_change_me}
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_change_me}
    ports:
      - "3002:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - maquis-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Reverse proxy local pour utiliser le nom de domaine sans port
  nginx:
    image: nginx:alpine
    container_name: maquis-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx-local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - maquis-network

networks:
  maquis-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
