# Configuration pour nginx système (à copier dans /etc/nginx/sites-available/au-bon-moment)
# Ensuite : sudo ln -s /etc/nginx/sites-available/ejomi /etc/nginx/sites-enabled/
# Puis : sudo nginx -t && sudo systemctl reload nginx

# Redirection HTTP vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name au-bon-moment.com www.au-bon-moment.com;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirection vers HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Configuration HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name au-bon-moment.com www.au-bon-moment.com;

    # Certificats SSL
    ssl_certificate /etc/letsencrypt/live/au-bon-moment.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/au-bon-moment.com/privkey.pem;

    # Configuration SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Taille max des uploads
    client_max_body_size 100M;

    # Logs
    access_log /var/log/nginx/ejomi-access.log;
    error_log /var/log/nginx/ejomi-error.log;

    # Route vers l'API (conteneur Docker sur port 3001)
    location /api/ {
        proxy_pass http://localhost:3001/api/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Application Next.js (conteneur Docker sur port 3002)
    location / {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Servir les fichiers uploads directement (depuis le dossier Docker)
    location /uploads/ {
        alias /home/edutrack/ejomi-api/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";

        # Headers CORS pour Vercel
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;

        # Preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # Health check
    location /health {
        proxy_pass http://localhost:3001/api/health;
        access_log off;
    }

    # Swagger docs
    location /api-docs {
        proxy_pass http://localhost:3001/api-docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
